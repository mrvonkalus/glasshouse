name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run typecheck

      - name: Verify harnesses
        run: npm run verify

      - name: Run demo
        run: npm run --silent demo
        env:
          NO_COLOR: "1"

      - name: Verify demo SVG freshness
        run: |
          npm run demo:svg
          git diff --exit-code -- assets/glob-route-drift-demo.svg
